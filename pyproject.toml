[project]
name = "scholarai"
version = "0.1.0"
description = "ScholarAI Workforce - a Supervisor-orchestrated multi-agent AI system for explainable, human-in-the-loop university scholarship evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openai>=1.40",
    "anthropic>=0.116",
    "httpx>=0.28.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "streamlit>=1.60.0",
    "qdrant-client>=1.18.0",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "tiktoken>=0.7",
    "plotly>=5.22",
    "pandas>=2.2",
    "ddgs>=9.5",
]

[project.optional-dependencies]
websearch = [
    "tavily-python>=0.5",
]

[project.scripts]
scholarai = "scholarai.interfaces.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholarai"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: FastAPI's Depends(...)-as-default-argument is the framework's canonical
# pattern, not the footgun this rule targets elsewhere.
# UP047: PEP 695 generic syntax is stylistic; TypeVar-based generics stay
# readable and are what most of the ecosystem still uses.
ignore = ["B008", "UP047"]

[tool.mypy]
python_version = "3.12"
packages = ["scholarai"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
